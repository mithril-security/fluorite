name: Publish Services Images

on:
  release:
    types: [published]

env:
  FLUORITE_VERSION: "0.1.0"

jobs:
  detect-service:
    runs-on: ubuntu-latest
    outputs:
      build_ats: ${{ steps.detect.outputs.build_ats }}
      build_domain_monitor: ${{ steps.detect.outputs.build_domain_monitor }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Detect service from tag
        id: detect
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [[ "$TAG" == services-v* ]]; then
            echo "build_ats=true" >> $GITHUB_OUTPUT
            echo "build_domain_monitor=true" >> $GITHUB_OUTPUT
            VERSION="${TAG#services-v}"
          elif [[ "$TAG" == domain-monitor-v* ]]; then
            echo "build_ats=false" >> $GITHUB_OUTPUT
            echo "build_domain_monitor=true" >> $GITHUB_OUTPUT
            VERSION="${TAG#domain-monitor-v}"
          else
            echo "build_ats=false" >> $GITHUB_OUTPUT
            echo "build_domain_monitor=false" >> $GITHUB_OUTPUT
            VERSION=""
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  publish-services-images:
    needs: detect-service
    if: needs.detect-service.outputs.version != ''
    runs-on: fluorite-runner
    timeout-minutes: 60
    environment: release
    steps:
      - name: Setup Earthly
        uses: earthly/actions-setup@v1
        with:
          version: v0.8.16

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: azure/docker-login@v1
        with:
          login-server: fluorite.azurecr.io
          username: fluorite
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Fetch Fluorite measurements
        run: |
          curl "https://storage.googleapis.com/fluorite/$FLUORITE_VERSION/gcp-cvm-notarizer/gcp_notarizer_measurements.json" > libraries/attestation/gcp-shielded-vm-attestation/gcp_notarizer_measurements.json
          curl "https://storage.googleapis.com/fluorite/$FLUORITE_VERSION/fluorite-os/baremetal-amd-sev/baremetal_measurements.json" > libraries/attestation/svsm-sev-attestation/baremetal_measurements.json

      - name: Build and push attestation-transparency-service
        if: needs.detect-service.outputs.build_ats == 'true'
        env:
          VERSION: ${{ needs.detect-service.outputs.version }}
        run: earthly --push +attestation-transparency-service-image --TAG=$VERSION

      - name: Build and push domain-monitor
        if: needs.detect-service.outputs.build_domain_monitor == 'true'
        env:
          VERSION: ${{ needs.detect-service.outputs.version }}
        run: earthly --push +domain-monitor-image --TAG=$VERSION
